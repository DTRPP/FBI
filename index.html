<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Access</title>

<style>
body {
  margin: 0;
  background: radial-gradient(circle at top, #111, #000);
  font-family: Arial;
  color: white;
  text-align: center;
  overflow: hidden;
}

.container {
  margin-top: 120px;
}

.logo {
  width: 150px;
  animation: float 4s ease-in-out infinite;
  filter: drop-shadow(0 0 12px rgba(255,215,0,0.4));
}

@keyframes float {
  0% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
  100% { transform: translateY(0); }
}

h1 {
  color: gold;
  letter-spacing: 3px;
  margin-top: 20px;
}

p {
  color: #aaa;
}

.btn {
  margin-top: 30px;
  padding: 12px 28px;
  background: gold;
  border: none;
  cursor: pointer;
  font-size: 16px;
  border-radius: 6px;
  transition: 0.3s;
}

.btn:hover {
  background: white;
  transform: scale(1.05);
}

/* glow background particles */
.bg {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, rgba(255,215,0,0.05), transparent 60%);
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="container">

  <img src="logo.png" class="logo">

  <h1>FEDERAL SYSTEM</h1>
  <p>Secure Access Terminal</p>

  <a href="dashboard.html">
    <button class="btn">ENTER SYSTEM</button>
  </a>

</div>

</body>
</html>
