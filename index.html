<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Federal System</title> <style> body { margin: 0; font-family: Arial, sans-serif; background: #050505; color: white; overflow-x: hidden; } /* خلفية خفيفة */ .bg { position: fixed; width: 100%; height: 100%; background: radial-gradient(circle at top, #111 0%, #000 70%); z-index: -1; } /* الكونتينر */ .container { text-align: center; margin-top: 120px; } /* الشعار */ .logo { width: 160px; animation: float 5s ease-in-out infinite; filter: drop-shadow(0 0 12px rgba(255,215,0,0.35)); } /* حركة هادئة */ @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } } /* العنوان */ h1 { margin-top: 20px; font-size: 40px; letter-spacing: 3px; color: gold; } /* نص */ p { color: #aaa; margin-top: 10px; } /* زر */ .btn { margin-top: 30px; padding: 12px 30px; background: gold; border: none; color: black; font-size: 16px; cursor: pointer; border-radius: 6px; transition: 0.3s; } .btn:hover { background: white; transform: scale(1.05); } /* شريط سفلي */ .footer { position: fixed; bottom: 10px; width: 100%; text-align: center; font-size: 12px; color: #666; } </style> </head> <body> <div class="bg"></div> <div class="container"> <!-- حط شعارك هنا --> <img src="logo.png" class="logo"> <h1>FEDERAL SYSTEM</h1> <p>Secure Access Terminal</p> <button class="btn" onclick="enter()">ENTER SYSTEM</button> </div> <div class="footer"> Secure Panel • Authorized Access Only </div> <script> function enter() { alert("Access Granted"); } </script> </body> </html>
